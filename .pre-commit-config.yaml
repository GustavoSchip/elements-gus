repos:
    - repo: "local"
      hooks:
          - id: "format-with-prettier"
            name: "Format with Prettier"
            entry: "prettier --ignore-unknown --write"
            language: "node"
            types:
                - "text"
            additional_dependencies:
                - "prettier@3.9.6"
                - "@prettier/plugin-xml@3.4.2"
                - "prettier-plugin-yaml@1.3.0"
